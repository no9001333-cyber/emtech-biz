name: 매일 입찰공고 수집

on:
  schedule:
    # 매일 한국시간(KST, UTC+9) 오전 8시 = UTC 전날 23시
    - cron: "0 23 * * *"
  workflow_dispatch: {}   # "Run workflow" 버튼으로 수동 실행도 가능

permissions:
  contents: write

jobs:
  collect:
    runs-on: self-hosted  # 사용자 PC에서 실행 (data.go.kr이 GitHub 공용 서버 IP를 막아서 변경)
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 공고 수집 + 대시보드 생성
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
          LH_SERVICE_KEY: ${{ secrets.LH_SERVICE_KEY }}
          D2B_SERVICE_KEY: ${{ secrets.D2B_SERVICE_KEY }}
          KWATER_SERVICE_KEY: ${{ secrets.KWATER_SERVICE_KEY }}
          KEPCO_API_KEY: ${{ secrets.KEPCO_API_KEY }}
          G2B_AWARDS_SERVICE_KEY: ${{ secrets.G2B_AWARDS_SERVICE_KEY }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: python main.py

      - name: 변경사항 커밋
        run: |
          git config user.name "bid-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/bids.json data/awards.json data/status.json docs/index.html
          git diff --quiet --cached || git commit -m "chore: 자동 공고 업데이트 $(date +'%Y-%m-%d %H:%M')"
          git push

      - name: 상태 점검 (문제 있으면 이 단계가 실패해서 GitHub이 이메일로 알려줌)
        run: |
          python -c "
          import json, sys
          data = json.load(open('data/status.json', encoding='utf-8'))
          problems = [s for s in data['sources'] if not s['ok']]
          for s in data['sources']:
              mark = '✅' if s['ok'] else '❌'
              print(f\"{mark} {s['source']}: {s['note']}\")
          if problems:
              print(f'::warning::문제 있는 소스 {len(problems)}개가 있습니다. 대시보드 상단 상태 배지를 확인하세요.')
              sys.exit(1)
          "
