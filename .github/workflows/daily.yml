name: 매일 입찰공고 수집

on:
  schedule:
    # 매일 한국시간(KST, UTC+9) 오전 8시 50분(출근시간 이후) = UTC 전날 23시 50분
    - cron: "50 23 * * *"
  workflow_dispatch: {}   # "Run workflow" 버튼으로 수동 실행도 가능

permissions:
  contents: write

# 예약 실행과 수동 실행(workflow_dispatch)이 겹치면 둘 다 main.py로 데이터를 수집해
# 서로 다른 내용으로 data/bids.json 등을 커밋하게 되고, 나중에 푸시하는 쪽이
# non-fast-forward + rebase 충돌로 실패한다(2026-09-11 run #109 실패 원인).
# 같은 브랜치에서는 한 번에 하나만 돌게 큐잉해서 이 충돌 자체를 막는다.
concurrency:
  group: daily-collect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: self-hosted  # 사용자 PC에서 실행 (data.go.kr이 GitHub 공용 서버 IP를 막아서 변경)
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 이전 실행 잔여 상태 정리 (PC가 실행 도중 꺼지는 경우 대비)
        # 이 PC는 매일 저녁 사용자가 끄고 다음 날 아침 다시 켠다. 그 사이에
        # 예약 실행이 걸려 있으면 러너가 작업을 실행하다 말고 그대로 전원이
        # 꺼지고, 다음 날 아침 부팅 후에야 GitHub이 그 실행을 뒤늦게
        # 취소/실패 처리한다(2026-09-12~09-14 사흘 연속 발생 - 실행 시간이
        # 24시간 넘게 찍힌 게 그 증거). 자체 호스팅 러너는 실행 사이에 .git을
        # 그대로 유지하므로, 이렇게 중간에 끊긴 실행이 만든 미완료 커밋이나
        # 진행 중이던 rebase가 다음 실행까지 이어져 매번 같은 충돌을 반복시켰다
        # (예: 2026-09-07에 만들어진 커밋이 2026-09-13 실행에서도 계속 재적용
        # 시도되다 충돌). actions/checkout은 이미 존재하는 로컬 브랜치를
        # origin과 강제로 맞추지 않으므로, 매 실행 시작 시 이 단계에서 무조건
        # origin/main 상태로 되돌려 이런 잔여 상태를 완전히 제거한다.
        run: |
          git rebase --abort
          git merge --abort
          git fetch origin main
          git reset --hard origin/main
        shell: cmd

      - name: 파이썬 버전 확인 (이 PC에 이미 설치된 Python 그대로 사용)
        # actions/setup-python은 GitHub이 호스팅하는 임시 러너용으로, 매번 별도
        # Python을 새로 내려받아 설치합니다. 이 자체 호스팅 러너(사용자 PC)에서는
        # 그 설치 과정 중 레지스트리 정리 단계(HKEY_LOCAL_MACHINE...Uninstall)가
        # "Requested registry access is not allowed" 오류로 실패해서 작업 자체가
        # 시작도 못 하고 죽고 있었습니다 (러너 서비스 계정에 해당 레지스트리 키에
        # 대한 관리자 권한이 없어서 발생). 이 PC에는 이미 Python이 설치되어 있으므로
        # 별도 설치 없이 PATH에 있는 python을 그대로 사용하도록 바꿨습니다.
        run: python --version

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: Playwright 브라우저 설치 (D2B 공고문 확인용 - 이미 설치돼있으면 빠르게 넘어감)
        # D2B(국방전자조달) 공고는 공식 API에 면허제한/지역제한 필드가 아예 없어서,
        # scrapers/d2b_restrictions.py가 실제 공고문 페이지를 열어(Playwright) 그
        # 정보를 가져옵니다. 그러려면 크로미움 브라우저가 이 PC에 있어야 합니다.
        run: python -m playwright install chromium

      - name: 공고 수집 + 대시보드 생성
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
          LH_SERVICE_KEY: ${{ secrets.LH_SERVICE_KEY }}
          D2B_SERVICE_KEY: ${{ secrets.D2B_SERVICE_KEY }}
          KWATER_SERVICE_KEY: ${{ secrets.KWATER_SERVICE_KEY }}
          KEPCO_API_KEY: ${{ secrets.KEPCO_API_KEY }}
          KOGAS_SERVICE_KEY: ${{ secrets.KOGAS_SERVICE_KEY }}
          G2B_AWARDS_SERVICE_KEY: ${{ secrets.G2B_AWARDS_SERVICE_KEY }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: python main.py

      - name: 변경사항 커밋
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python commit_and_push.py

      - name: 상태 점검 (문제 있으면 이 단계가 실패해서 GitHub이 이메일로 알려줌)
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python check_status.py
