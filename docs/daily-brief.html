<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 신규공고 전략브리핑 | 이엠테크</title>
<style>
  :root {
    --ink: #14213d;
    --paper: #fbfaf7;
    --line: #e4e1d8;
    --accent: #c8511b;
    --accent-soft: #f5e3d8;
    --muted: #6b6b63;
    --card: #ffffff;
    --good: #2a6f97;
    --good-soft: #e4eef4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--paper);
    color: var(--ink);
  }
  header { padding: 28px 24px 16px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0 0 6px; font-size: 1.4rem; letter-spacing: -0.02em; }
  header p { margin: 0; color: var(--muted); font-size: 0.88rem; }
  .meta { display:flex; gap:16px; flex-wrap:wrap; margin-top:12px; font-size:0.85rem; color:var(--muted); }
  .meta b { color: var(--ink); }
  .back-link { display:inline-block; margin-top:14px; font-size:0.82rem; color:var(--good); text-decoration:none; }
  .back-link:hover { text-decoration:underline; }

  main { padding: 24px 24px 60px; max-width: 960px; margin: 0 auto; }

  .empty-state {
    text-align:center; padding: 80px 20px; color: var(--muted);
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  }
  .empty-state .big { font-size: 1.1rem; color: var(--ink); margin-bottom: 8px; font-weight: 600; }

  .cards { display:flex; flex-direction:column; gap:16px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 20px 22px;
  }
  .card h2 { margin:0 0 4px; font-size: 1.05rem; letter-spacing:-0.01em; }
  .card h2 a { color: var(--ink); text-decoration: none; }
  .card h2 a:hover { color: var(--accent); text-decoration: underline; }
  .card .org { color: var(--muted); font-size: 0.82rem; margin-bottom: 12px; }
  .facts { display:flex; flex-wrap:wrap; gap:8px 18px; font-size:0.82rem; margin-bottom:14px; }
  .facts span b { color: var(--ink); }
  .facts span { color: var(--muted); }
  .tag { display:inline-block; font-size:0.72rem; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); margin-left:6px; }
  .tag.confirmed { border-color: var(--good); color: var(--good); }
  .tag.tentative { border-color: #a67c00; color: #a67c00; }

  .analysis { border-top:1px dashed var(--line); padding-top:12px; font-size:0.88rem; line-height:1.6; }
  .analysis p { margin: 4px 0; }
  .analysis .label { color: var(--accent); font-weight:600; }
  .conclusion {
    margin-top:10px; padding:8px 12px; border-radius:8px; background: var(--good-soft);
    color: var(--good); font-weight:600; font-size:0.85rem;
  }

  footer { padding:20px 24px 40px; font-size:0.78rem; color:var(--muted); border-top:1px solid var(--line); margin-top:20px; }
</style>
</head>
<body>

<header>
  <h1>오늘의 신규공고 전략브리핑</h1>
  <p>나라장터 통신공사(정보통신공사업) 신규 공고 — 이엠테크 수주전략가 관점 분석</p>
  <div class="meta">
    <span>기준일: <b>2026-09-02</b></span>
    <span>신규 공고: <b>0건</b></span>
    <span>비교 기준: 직전 수집(2026-09-01) 대비</span>
  </div>
  <a class="back-link" href="index.html">← 입찰공고 목록으로</a>
</header>

<main>
  <div class="empty-state">
    <div class="big">오늘은 신규 없음</div>
    어제(2026-09-01) 수집 결과 대비, 나라장터 통신공사 관련 신규 공고가 없습니다.
  </div>
</main>

<footer>
  이엠테크(경기도 용인, 정보통신공사업, 시공능력평가액 약 54억원) 내부 참고용 자동 분석입니다. 실제 투찰 전 반드시 공고 원문과 첨부 규격서를 직접 확인하세요.
</footer>

</body>
</html>
